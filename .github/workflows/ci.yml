name: CI

# Five jobs, in the order the repository is built: the Go tree, the desktop
# frontend with a real core behind it, the interop gate that dials reference
# implementations of each protocol, the native macOS application built with
# Apple's own toolchain, and a macOS 26 UI pass that exercises the glass branch
# without producing a release artifact.
#
# Nothing here downloads into the repository, and nothing here needs a secret:
# the reference implementations are fetched into a directory outside the tree and
# checked against the hashes their releases publish. The macOS job is ad-hoc
# signed and produces a candidate DMG; Gatekeeper's first-open flow belongs to
# a clean VM, not to CI.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The toolchain is pinned by go.mod, so the job cannot drift from it.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The interop tests skip without MELONARC_INTEROP_DIR, which is what makes
      # this job usable on its own; they get their own job below.
      - name: Test
        run: go test ./... -count=1

      # The product ships on Windows, so the cross-compile is part of the gate.
      # ./... is not used: spikes/ holds Unix-only prototypes that have never
      # been meant to build for Windows (see DEVLOG stage 8).
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build ./cmd/... ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          # apps/desktop requires node >= 20 and has no dependencies at all, so
          # the lockfile is the whole graph and `npm ci` needs no network.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend
        working-directory: apps/desktop
        run: npm run build

      # Offline pass: the two cases that need a live core skip here and say so.
      - name: Test without a core
        working-directory: apps/desktop
        run: npm test

      - name: Build the core
        run: |
          mkdir -p /tmp/arc
          go build -o /tmp/arc/melonarc-core ./cmd/melonarc-core

      # The demonstration configuration used by hand in stages 13-19: one proxy,
      # one group of each type, a handful of rules, and a data directory the test
      # can read the token from.
      - name: Write the demonstration configuration
        run: |
          mkdir -p /tmp/arc/data
          cat > /tmp/arc/demo.conf <<'CONF'
          [General]
          log-level = info
          api-listen = 127.0.0.1:7946
          data-dir = /tmp/arc/data

          [Proxy]
          NodeA = ss, 127.0.0.1, 8388, aes-128-gcm, demo-secret
          NodeB = socks5, 127.0.0.1, 1080

          [Proxy Group]
          manual = select, NodeA, NodeB
          auto = url-test, NodeA, NodeB, url=http://127.0.0.1:9/probe, interval=600
          backup = fallback, NodeA, NodeB, url=http://127.0.0.1:9/probe

          [Rule]
          rule-set local = ./rulesets/local.txt
          DOMAIN,example.com,DIRECT
          DOMAIN-SUFFIX,example.org,manual
          DOMAIN-KEYWORD,tracker,REJECT
          IP-CIDR,127.0.0.0/8,DIRECT
          IP-CIDR6,::1/128,DIRECT
          DEST-PORT,8080,manual
          PROTOCOL,udp,DIRECT
          FINAL,manual

          [Host]
          demo.example = 127.0.0.1
          CONF
          mkdir -p /tmp/arc/rulesets
          printf 'DOMAIN-SUFFIX,ads.example\n' > /tmp/arc/rulesets/local.txt
          /tmp/arc/melonarc-core -config /tmp/arc/demo.conf -check

      - name: Start the core
        run: |
          nohup /tmp/arc/melonarc-core -config /tmp/arc/demo.conf > /tmp/arc/core.log 2>&1 &
          for _ in $(seq 1 60); do
            token=$(cat /tmp/arc/data/api-token 2>/dev/null || true)
            if [ -n "$token" ] &&
              curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7946/healthz >/dev/null; then
              echo "the core is answering"
              exit 0
            fi
            sleep 1
          done
          echo "the core did not answer within 60s"
          cat /tmp/arc/core.log
          exit 1

      # Live pass: all cases, including the ones that read the core's answers.
      - name: Test against the running core
        working-directory: apps/desktop
        env:
          MELONARC_TEST_API: 127.0.0.1:7946
          MELONARC_TEST_DATA_DIR: /tmp/arc/data
        run: npm test

      - name: Core log
        if: always()
        run: cat /tmp/arc/core.log

  interop:
    name: Interop
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MELONARC_INTEROP_DIR: ${{ github.workspace }}/interop
      XRAY_TAG: v26.11.9
      SHADOWSOCKS_TAG: v1.25.0
      SNELL_VERSION: v5.0.0
      HYSTERIA_TAG: app/v2.13.0
      TUIC_TAG: tuic-server-1.0.0
      # Snell has no release page a machine can read: the zip and its hash are
      # published on a download page, so both arrive through repository variables
      # instead of being guessed here. Empty values fail the step on purpose.
      SNELL_ZIP_URL: ${{ vars.SNELL_ZIP_URL }}
      SNELL_ZIP_SHA256: ${{ vars.SNELL_ZIP_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Asset names follow each release page. They are globs on purpose: the tag
      # and the target triple appear in most of them, and a bump should be a
      # change of the version above rather than a rewrite of the pattern.
      - name: Fetch the reference implementations
        run: |
          set -eu
          work=$RUNNER_TEMP/interop-download
          mkdir -p "$work"

          gh release download "$XRAY_TAG" --repo XTLS/Xray-core \
            --pattern 'Xray-linux-64.zip*' --dir "$work"
          gh release download "$SHADOWSOCKS_TAG" --repo shadowsocks/shadowsocks-rust \
            --pattern 'shadowsocks-*.x86_64-unknown-linux-gnu.tar.xz*' --dir "$work"
          gh release download "$HYSTERIA_TAG" --repo apernet/hysteria \
            --pattern 'hysteria-linux-amd64' --pattern 'hashes.txt' --dir "$work"
          gh release download "$TUIC_TAG" --repo tuic-protocol/tuic \
            --pattern 'tuic-server-*-x86_64-unknown-linux-gnu*' --dir "$work"

          if [ -z "$SNELL_ZIP_URL" ] || [ -z "$SNELL_ZIP_SHA256" ]; then
            echo "::error::SNELL_ZIP_URL and SNELL_ZIP_SHA256 must be set from the snell-server $SNELL_VERSION download page"
            exit 1
          fi
          curl -fsSL -o "$work/snell-server.zip" "$SNELL_ZIP_URL"

      - name: Verify the downloads
        run: |
          set -eu
          work=$RUNNER_TEMP/interop-download
          cd "$work"

          # Xray: the .dgst file is text, one hash per line.
          want=$(sed -n 's/^SHA2-256=[[:space:]]*//p' Xray-linux-64.zip.dgst | tr -d '\r')
          test -n "$want"
          echo "$want  Xray-linux-64.zip" | sha256sum -c -

          # shadowsocks-rust: the .sha256 file is already sha256sum's input.
          sha256sum -c shadowsocks-*.x86_64-unknown-linux-gnu.tar.xz.sha256

          # hysteria: hashes.txt lists the assets by name.
          grep 'hysteria-linux-amd64$' hashes.txt | sed 's|build/||' | sha256sum -c -

          # tuic-server: same shape as shadowsocks, a .sha256sum beside the zip.
          sha256sum -c ./*.sha256sum

          # snell: no checksum file exists, so the value comes from the page.
          echo "$SNELL_ZIP_SHA256  snell-server.zip" | sha256sum -c -

      - name: Lay out the slots
        run: |
          set -eu
          work=$RUNNER_TEMP/interop-download
          dir=$MELONARC_INTEROP_DIR
          mkdir -p "$dir"/{shadowsocks,vmess,trojan,vless,snell,hysteria2,tuic}

          # One binary speaks three protocols; the slots name protocols, so the
          # same file answers three of them.
          unzip -qo "$work/Xray-linux-64.zip" -d "$work/xray"
          install -m 0755 "$work/xray/xray" "$dir/vless/server"
          ln -sf ../vless/server "$dir/vmess/server"
          ln -sf ../vless/server "$dir/trojan/server"

          tar -xJf "$work"/shadowsocks-*.x86_64-unknown-linux-gnu.tar.xz -C "$work"
          install -m 0755 "$work/ssserver" "$dir/shadowsocks/server"

          install -m 0755 "$work/hysteria-linux-amd64" "$dir/hysteria2/server"

          install -m 0755 "$work"/tuic-server-*-x86_64-unknown-linux-gnu "$dir/tuic/server"

          unzip -qo "$work/snell-server.zip" -d "$work/snell"
          install -m 0755 "$(find "$work/snell" -name 'snell-server' -type f -print -quit)" "$dir/snell/server"

          find "$dir" -maxdepth 2 -name server -exec ls -l {} \;

      # A skip counts as a failure: with every slot filled there is no legitimate
      # reason for one, and "skipped" must never read as "verified".
      - name: Gate
        run: bash scripts/check-interop.sh

  # The fourth job builds the native macOS application. This is the only job
  # that needs a Mac: Xcode compiles and tests the Swift sources, codesign and
  # hdiutil do the signing and packaging. The cross-platform Tauri shell stays
  # for Windows and Linux and is not built here (D10, D11).
  #
  # No secret, certificate or notarisation account is needed: the preview is
  # ad-hoc signed, and the first-open flow is a M5 VM check, not a CI step.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # One pin, recorded verbatim in toolchain.txt. Xcode 26.3 (17C529) ships
      # the macOS 26.2 SDK and Swift 6.2.3; both macOS runner images list it.
      # If the image moves, update this line instead of letting the build pick
      # a compiler without the glass symbols.
      XCODE_APP: /Applications/Xcode_26.3.app
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select Xcode and record the toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::pinned Xcode $XCODE_APP is not installed on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          mkdir -p "$RUNNER_TEMP/macos"
          {
            printf 'xcode-select: '; xcode-select -p
            xcodebuild -version
            printf 'sdk: '; xcrun --sdk macosx --show-sdk-version
            xcrun swift --version
            go version
            sw_vers
            printf 'uname -m: '; uname -m
          } 2>&1 | tee "$RUNNER_TEMP/macos/toolchain.txt"
          toolchain="$RUNNER_TEMP/macos/toolchain.txt"
          grep -q 'Xcode 26.3' "$toolchain" || { echo "::error::expected Xcode 26.3"; exit 1; }
          grep -q 'Build version 17C529' "$toolchain" || { echo "::error::expected Xcode build 17C529"; exit 1; }
          grep -q '^sdk: 26\.2$' "$toolchain" || { echo "::error::expected macOS SDK 26.2"; exit 1; }
          grep -q 'version 6\.2\.3' "$toolchain" || { echo "::error::expected Swift 6.2.3"; exit 1; }
          grep -q '^uname -m: arm64$' "$toolchain" || { echo "::error::expected arm64 runner"; exit 1; }

      # These are the checks that can also run on Linux. They are repeated here
      # so a project-file or catalog mistake fails before a nine-minute Xcode
      # build rather than halfway through it.
      - name: Check the project and string catalog
        run: |
          set -eu
          python3 apps/macos/scripts/check-project.py
          python3 apps/macos/scripts/check-strings.py

      # A build-30 style bundle has the icon name but no icon resource. The
      # release gate must reject that sample instead of sealing an empty icon.
      - name: Reject an icon name without an icon resource
        run: |
          set -euo pipefail
          fake=$(mktemp -d "${TMPDIR:-/tmp}/melonarc-icon-negative.XXXXXX")
          mkdir -p "$fake/Empty.app/Contents/Resources"
          plutil -create xml1 "$fake/Empty.app/Contents/Info.plist"
          plutil -insert CFBundleIconName -string AppIcon "$fake/Empty.app/Contents/Info.plist"
          if bash apps/macos/scripts/verify-app-icon.sh "$fake/Empty.app" >/dev/null 2>&1; then
            echo "::error::the icon check accepted a bundle with no icon resource"
            exit 1
          fi
          rm -rf "$fake"
          echo "ok: icon check rejects a bundle with an icon name but no image"

      # The core is a build input of the Xcode target, which copies it into
      # Contents/MacOS. go.mod selects the compiler; CGO is off so no SDK is
      # needed for this step.
      - name: Build the darwin/arm64 core
        run: bash apps/macos/scripts/build-core.sh

      - name: Test the app and the real sidecar
        id: app_tests
        env:
          TEST_RUNNER_MELONARC_TEST_CORE: ${{ github.workspace }}/apps/macos/MelonARC/Core/melonarc-core
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/macos/xcodebuild-test.log"
          status=0
          xcodebuild test \
            -project apps/macos/MelonARC.xcodeproj \
            -scheme MelonARC \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/macos/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/macos/Tests.xcresult" \
            2>&1 | tee "$log" || status=$?
          # A skipped real-core test would make this job green for no reason.
          if grep -q 'MELONARC_TEST_CORE is not set' "$log"; then
            echo "::error::the real-core tests were skipped, so the sidecar is not verified"
            status=1
          fi
          exit "$status"

      - name: Upload failed test diagnostics
        if: failure() && steps.app_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-diagnostics
          path: |
            ${{ runner.temp }}/macos/Tests.xcresult
            ${{ runner.temp }}/macos/xcodebuild-test.log
          retention-days: 14

      - name: Build the Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -configuration Release \
            -project apps/macos/MelonARC.xcodeproj \
            -scheme MelonARC \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/macos/DerivedData" \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/macos/xcodebuild-release.log"

      - name: Check both executables
        run: |
          app="$RUNNER_TEMP/macos/DerivedData/Build/Products/Release/MelonARC.app"
          bash apps/macos/scripts/verify-binaries.sh \
            "$app/Contents/MacOS/MelonARC" \
            "$app/Contents/MacOS/melonarc-core"

      # Inside-out signing, recursive verification, a read-only compressed DMG,
      # an attachment re-check and the hash of the .dmg file itself.
      - name: Sign and package
        env:
          CANDIDATE_VERSION: 0.1.0-preview-candidate
          XCODEBUILD_RELEASE_LOG: ${{ runner.temp }}/macos/xcodebuild-release.log
        run: |
          app="$RUNNER_TEMP/macos/DerivedData/Build/Products/Release/MelonARC.app"
          version="${CANDIDATE_VERSION}.${GITHUB_RUN_NUMBER}"
          dmg="melonarc-${version}-macos-arm64.dmg"
          echo "CANDIDATE_DMG=${dmg}" >> "$GITHUB_ENV"
          bash apps/macos/scripts/package-dmg.sh \
            "$app" "$RUNNER_TEMP/macos/${dmg}"

      - name: Check and freeze the candidate manifest
        env:
          CANDIDATE_VERSION: 0.1.0-preview-candidate
        run: |
          app="$RUNNER_TEMP/macos/DerivedData/Build/Products/Release/MelonARC.app"
          version="${CANDIDATE_VERSION}.${GITHUB_RUN_NUMBER}"
          bash apps/macos/scripts/check-candidate.sh \
            "$app" "$RUNNER_TEMP/macos/${CANDIDATE_DMG}" \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$version" \
            "$RUNNER_TEMP/macos/candidate.json"

      - uses: actions/upload-artifact@v4
        with:
          name: melonarc-macos-arm64
          path: |
            ${{ runner.temp }}/macos/melonarc-*.dmg
            ${{ runner.temp }}/macos/melonarc-*.dmg.sha256
            ${{ runner.temp }}/macos/candidate.json
            ${{ runner.temp }}/macos/toolchain.txt
            ${{ runner.temp }}/macos/xcodebuild-test.log
            ${{ runner.temp }}/macos/xcodebuild-release.log
          if-no-files-found: error
          retention-days: 14

  # The glass branch is compiled by the same Xcode as the release job and run
  # on macOS 26, where the native glass API is available. This job only tests
  # that branch; the single candidate DMG still comes from the macOS 15 job.
  macos-glass-ui:
    name: macOS 26 UI (glass)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_26.3.app
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select Xcode and record the toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::pinned Xcode $XCODE_APP is not installed on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          mkdir -p "$RUNNER_TEMP/macos"
          {
            printf 'xcode-select: '; xcode-select -p
            xcodebuild -version
            printf 'sdk: '; xcrun --sdk macosx --show-sdk-version
            xcrun swift --version
            go version
            sw_vers
            printf 'uname -m: '; uname -m
          } 2>&1 | tee "$RUNNER_TEMP/macos/toolchain.txt"
          toolchain="$RUNNER_TEMP/macos/toolchain.txt"
          grep -q 'Xcode 26.3' "$toolchain" || { echo "::error::expected Xcode 26.3"; exit 1; }
          grep -q 'Build version 17C529' "$toolchain" || { echo "::error::expected Xcode build 17C529"; exit 1; }
          grep -q '^sdk: 26\.2$' "$toolchain" || { echo "::error::expected macOS SDK 26.2"; exit 1; }
          grep -q 'version 6\.2\.3' "$toolchain" || { echo "::error::expected Swift 6.2.3"; exit 1; }
          grep -q '^uname -m: arm64$' "$toolchain" || { echo "::error::expected arm64 runner"; exit 1; }

      - name: Check the project and string catalog
        run: |
          set -eu
          python3 apps/macos/scripts/check-project.py
          python3 apps/macos/scripts/check-strings.py

      - name: Build the darwin/arm64 core
        run: bash apps/macos/scripts/build-core.sh

      - name: Run the glass UI tests
        env:
          TEST_RUNNER_MELONARC_TEST_CORE: ${{ github.workspace }}/apps/macos/MelonARC/Core/melonarc-core
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/macos/xcodebuild-glass-test.log"
          status=0
          xcodebuild test \
            -project apps/macos/MelonARC.xcodeproj \
            -scheme MelonARC \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/macos/GlassDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/macos/GlassTests.xcresult" \
            2>&1 | tee "$log" || status=$?
          # A skipped real-core test would make this job green for no reason.
          if grep -q 'MELONARC_TEST_CORE is not set' "$log"; then
            echo "::error::the real-core tests were skipped, so the sidecar is not verified"
            status=1
          fi
          exit "$status"

      # XCUITest screenshots are XCTest attachments inside the result bundle.
      - name: Upload glass UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-glass-ui-diagnostics
          path: |
            ${{ runner.temp }}/macos/GlassTests.xcresult
            ${{ runner.temp }}/macos/xcodebuild-glass-test.log
            ${{ runner.temp }}/macos/toolchain.txt
          if-no-files-found: warn
          retention-days: 14
