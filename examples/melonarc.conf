# MelonARC example configuration
#
# Minimal and deliberately fictional: every address comes from a documentation
# range (RFC 5737: 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24), every name is
# a reserved example domain (RFC 2606), and the credential is a placeholder.
# Nothing here reaches a real server.
#
# Replace the [Proxy] entry before using this file, then check it without
# starting anything:
#
#   melonarc-core -config examples/melonarc.conf -check
#
# The core writes its API token and its observation history into data-dir, which
# is created on the first start and not by -check.

[General]
# Both listeners and the API are on loopback: an inbound is a proxy, and a proxy
# that listens on every interface is an open relay.
log-level = info
api-listen = 127.0.0.1:7946
http-listen = 127.0.0.1:7890
socks5-listen = 127.0.0.1:7891
# Relative to this file. Change it to a directory you can write to.
data-dir = ./melonarc-data

[Proxy]
# A SOCKS5 outbound. The username and password are placeholders; a real entry
# carries that server's credentials.
ExampleProxy = socks5, 203.0.113.10, 1080, username=example, password=change-me

[Proxy Group]
# One group of each type. DIRECT is built in and needs no [Proxy] entry.
Proxy = select, ExampleProxy, DIRECT
Auto = url-test, ExampleProxy, DIRECT, url=https://example.com/, interval=300, tolerance=50
Backup = fallback, Auto, DIRECT, url=https://example.com/, interval=300

[Rule]
# First match wins, so the order is the policy. FINAL must be last and decides
# everything the rules above did not.
DOMAIN,example.com,DIRECT
DOMAIN-SUFFIX,example.net,Proxy
DOMAIN-KEYWORD,example,Auto
IP-CIDR,198.51.100.0/24,DIRECT
IP-CIDR,203.0.113.0/24,Proxy
DEST-PORT,8080,Backup
FINAL,Proxy

[Host]
# A fixed mapping: this name is answered from here and never looked up.
docs.example.com = 192.0.2.10
